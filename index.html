<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Pagal 💖</title>
    <style>
        /* CSS: Styling and Animations */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ffc3a0 0%, #ffafbd 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 90%;
            width: 400px;
            z-index: 10;
        }

        img {
            width: 200px;
            border-radius: 15px;
            margin-bottom: 10px;
        }

        h1 {
            color: #ff4b2b;
            font-size: 1.6rem;
            margin: 20px 0;
            font-weight: 800;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            height: 50px; /* Keeps the container stable when the No button runs away */
        }

        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
        }

        #yesBtn {
            background-color: #ff4b2b;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #e63900;
        }

        #noBtn {
            background-color: #fff;
            color: #ff4b2b;
            border: 2px solid #ff4b2b;
            position: relative; 
            z-index: 100;
        }

        /* Loading Screen and Final Screen are hidden initially */
        #loader, #finalScreen {
            display: none;
        }

        .heart-loader {
            font-size: 60px;
            animation: heartbeat 0.8s infinite alternate;
            margin: 20px 0;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.3); }
        }

        /* Confetti Animation for the ending */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            animation: fall linear infinite forwards;
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        
        <div id="questionScreen">
            <img src="https://media.tenor.com/w1E2_Z2ZEX4AAAAi/peach-goma.gif" alt="Cute bears asking">
            <h1 id="questionText">Oye sun, am I the absolute best thing in your life? 🥺</h1>
            
            <div class="btn-group">
                <button id="yesBtn">Haan obvio! 💖</button>
                <button id="noBtn">Nahi, chal nikal 🙄</button>
            </div>
        </div>

        <div id="loader">
            <h1>Checking your dil ka sach... ⏳</h1>
            <div class="heart-loader">💖</div>
        </div>

        <div id="finalScreen">
            <img src="https://media.tenor.com/I2qA3lBvGf4AAAAi/peach-goma-love.gif" alt="Hugging Bears">
            <h1>Ahaaa! Mujhe toh pehle se hi pata tha pagli! 😂</h1>
            <p style="font-size: 1.1rem; color: #444; line-height: 1.6; margin-top: 10px;">
                You are permanently stuck with me! Tu duniya ki sabse amazing, pagal, aur dramebaaz bestie hai. 
                I love you beyond words! <br><br><strong>Happy Best Friend Day! ✨💕</strong>
            </p>
        </div>
    </div>

    <script>
        // JavaScript: The Brains behind the Magic
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionScreen = document.getElementById('questionScreen');
        const loader = document.getElementById('loader');
        const finalScreen = document.getElementById('finalScreen');
        
        // This function makes the "No" button run away to a random spot
        function moveNoButton() {
            // Calculate maximum X and Y boundaries so it doesn't go off-screen
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            // Generate a random position
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            
            // Move the button!
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Trigger the dodge on Hover (for laptops)
        noBtn.addEventListener('mouseover', moveNoButton);
        
        // Trigger the dodge on Touch (for phones)
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault(); // Prevents her from actually clicking it before it moves
            moveNoButton();
        });

        // When she finally gives up and clicks YES
        yesBtn.addEventListener('click', () => {
            // 1. Hide the question screen
            questionScreen.style.display = 'none';
            // 2. Show the loading screen with the heartbeat animation
            loader.style.display = 'block';
            
            // 3. Wait exactly 2.5 seconds, then show the final screen & trigger confetti
            setTimeout(() => {
                loader.style.display = 'none';
                finalScreen.style.display = 'block';
                startConfetti();
            }, 2500);
        });

        // Generates an endless confetti shower
        function startConfetti() {
            const colors = ['#ff4b2b', '#ff416c', '#ffb88c', '#ffd700', '#00c6ff', '#ff6ec7'];
            
            for(let i = 0; i < 150; i++) {
                let confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Randomize starting positions, colors, and fall speeds
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 2) + 's';
                
                document.body.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
