<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Best Friend Day! 💖</title>
    <style>
        /* This is the CSS - It makes everything look pretty */
        body {
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transform: scale(0);
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            max-width: 80%;
        }
        @keyframes popIn {
            to { transform: scale(1); }
        }
        h1 {
            color: #ff6b6b;
            margin-top: 0;
        }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        button:hover {
            background: #ff4757;
            transform: scale(1.1);
        }
        .hidden-message {
            display: none;
            margin-top: 20px;
            font-size: 20px;
            color: #333;
            line-height: 1.5;
        }
        .heart {
            position: absolute;
            font-size: 24px;
            animation: floatUp linear infinite;
            z-index: -1;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Best Friend Day! ✨</h1>
        <p>To the absolute best bestie in the world...</p>
        
        <button id="magicButton" onclick="revealMessage()">Click to Unlock My Secret Message</button>
        
        <div id="msg" class="hidden-message">
            <p><strong>Surprise! 🎉</strong></p>
            <p>You are amazing, and I am so lucky to have you as my best friend. Thanks for all the laughs and memories!</p>
            <p><em>(Yes, I actually coded this just for you! 👩‍💻😎)</em></p>
        </div>
    </div>

    <script>
        /* This is the JavaScript - It makes the interactive magic happen */
        function revealMessage() {
            // Show the hidden message
            document.getElementById('msg').style.display = 'block';
            // Hide the button after clicking
            document.getElementById('magicButton').style.display = 'none';
            
            // Create a bunch of floating hearts!
            for(let i = 0; i < 50; i++) {
                setTimeout(createHeart, i * 50);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            const emojis = ['💖', '✨', '🌸', '🥺'];
            heart.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            heart.classList.add('heart');
            
            // Randomize position and animation speed
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            
            document.body.appendChild(heart);
            
            // Remove the heart after it floats away to keep the code running smoothly
            setTimeout(() => { heart.remove(); }, 5000);
        }
    </script>
</body>
</html>
